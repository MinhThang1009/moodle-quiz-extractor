name: Release

# Build và publish GitHub Release khi đẩy tag phiên bản (v*).
# GitHub Release dựa trên git tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish hoặc cập nhật GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Nếu release cho tag này đã tồn tại (vd release-please tạo) -> đính kèm artifact;
        # nếu chưa -> tạo mới (luồng tag thủ công). Chỉ phép dò tồn tại mới ẩn output, nên
        # lỗi create/upload thật (auth, mạng) vẫn báo rõ.
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi

  pypi:
    name: Publish PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # OIDC Trusted Publishing — không cần token/secret
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      # Yêu cầu: cấu hình Trusted Publisher trên PyPI (project -> Publishing) cho repo
      # MinhThang1009/moodle-quiz-extractor, workflow release.yml. Chưa cấu hình -> job này fail
      # nhưng KHÔNG ảnh hưởng job release (GitHub Release vẫn tạo).
      - name: Publish lên PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
