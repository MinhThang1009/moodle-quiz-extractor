name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# Hủy run cũ khi có push mới trên cùng ref (tiết kiệm CI minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Cài công cụ
        run: pip install black ruff mypy
      - name: black --check
        run: black --check .
      - name: ruff check
        run: ruff check .
      - name: mypy
        run: mypy quiz_extractor

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Cài deps tối thiểu (không cần easyocr/torch cho unit test)
        run: pip install numpy opencv-python-headless pytest
      - name: pytest
        run: pytest
      - name: CLI --help (smoke)
        run: python -m quiz_extractor --help

  ci-success:
    name: CI success
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Tất cả job CI đã pass."
