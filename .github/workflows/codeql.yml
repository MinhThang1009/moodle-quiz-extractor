name: CodeQL

# Phân tích lỗ hổng bảo mật mã nguồn (code scanning) cho Python.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # 03:00 UTC thứ Hai hằng tuần

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # ghi cảnh báo code-scanning
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Init CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@v3
