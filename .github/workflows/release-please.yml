name: release-please

# Mỗi lần push lên main, release-please mở/cập nhật 1 "release PR" bump version +
# CHANGELOG từ Conventional Commits. Merge PR đó -> tạo git tag + GitHub Release ->
# kích hoạt release.yml build và đính kèm artifact.
#
# Lưu ý: project dùng dynamic version từ quiz_extractor/__init__.py (__version__).
# Kiểm tra release PR đầu tiên có bump đúng file đó không; nếu chưa, cấu hình thêm
# extra-files / version-file. Pin @v5 (current major).
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # Manifest mode: cấu hình ở release-please-config.json + .release-please-manifest.json
          # -> bump cả CHANGELOG lẫn __version__ trong quiz_extractor/__init__.py (extra-files).
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Ưu tiên PAT (RELEASE_PLEASE_TOKEN) để tag kích hoạt release.yml; fallback
          # GITHUB_TOKEN để workflow không fail khi chưa cấu hình PAT.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
